<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><g font-family="Arial, PingFang SC, sans-serif"><rect width="1200" height="680" fill="#f5f3ee"/><rect x="40" y="36" width="1120" height="608" rx="16" fill="#fffefa" stroke="#dcded6"/><text x="76" y="80" font-size="15" fill="#727b70" font-weight="600">COOKBOOK / EXCEL-INDUSTRY-ANALYSIS</text><text x="76" y="140" font-size="34" fill="#292d29" font-weight="600">地区汇总报告</text><text x="76" y="179" font-size="22" fill="#687267" font-weight="400">从订单明细得到可复算的净额</text><rect x="76" y="204" width="1048" height="1" fill="#e0e3dc"/><rect x="76" y="244" width="1048" height="72" rx="8" fill="#f5f6f2"/><text x="98" y="288" font-size="22" fill="#536b59" font-weight="600">订单 a</text><text x="425" y="288" font-size="23" fill="#292d29" font-weight="400">100 − 20 = 80</text><rect x="76" y="334" width="1048" height="72" rx="8" fill="#f5f6f2"/><text x="98" y="378" font-size="22" fill="#536b59" font-weight="600">订单 b</text><text x="425" y="378" font-size="23" fill="#292d29" font-weight="400">50 − 0 = 50</text><rect x="76" y="424" width="1048" height="72" rx="8" fill="#eaf2ec"/><text x="98" y="468" font-size="22" fill="#536b59" font-weight="600">东区净额</text><text x="425" y="468" font-size="23" fill="#292d29" font-weight="400">80 + 50 = 130</text><text x="76" y="562" font-size="20" fill="#536b59" font-weight="400">同一币种 · 订单去重 · 金额减退款后汇总</text><text x="76" y="613" font-size="16" fill="#8b6b42" font-weight="400">效果示意 · 合成数据 · 非产品界面截图</text></g></svg>