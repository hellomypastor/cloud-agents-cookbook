<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><g font-family="Arial, PingFang SC, sans-serif"><rect width="1200" height="680" fill="#f5f3ee"/><rect x="40" y="36" width="1120" height="608" rx="16" fill="#fffefa" stroke="#dcded6"/><text x="76" y="80" font-size="15" fill="#727b70" font-weight="600">COOKBOOK / MARLIN-DATA-AGENT</text><text x="76" y="140" font-size="34" fill="#292d29" font-weight="600">转化分析报告</text><text x="76" y="179" font-size="22" fill="#687267" font-weight="400">先确认变化幅度，再调查原因</text><rect x="76" y="204" width="1048" height="1" fill="#e0e3dc"/><rect x="76" y="244" width="1048" height="72" rx="8" fill="#f5f6f2"/><text x="98" y="288" font-size="22" fill="#536b59" font-weight="600">周期 A</text><text x="425" y="288" font-size="23" fill="#292d29" font-weight="400">20 / 100 = 20%</text><rect x="76" y="334" width="1048" height="72" rx="8" fill="#f5f6f2"/><text x="98" y="378" font-size="22" fill="#536b59" font-weight="600">周期 B</text><text x="425" y="378" font-size="23" fill="#292d29" font-weight="400">15 / 100 = 15%</text><rect x="76" y="424" width="1048" height="72" rx="8" fill="#eaf2ec"/><text x="98" y="468" font-size="22" fill="#536b59" font-weight="600">变化幅度</text><text x="425" y="468" font-size="23" fill="#292d29" font-weight="400">下降 5 个百分点</text><text x="76" y="562" font-size="20" fill="#536b59" font-weight="400">缺少渠道与实验信息，不能直接归因于产品改动</text><text x="76" y="613" font-size="16" fill="#8b6b42" font-weight="400">效果示意 · 合成数据 · 非产品界面截图</text></g></svg>